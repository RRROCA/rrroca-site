name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            content:
              - 'content/**'
              - 'static/images/**'
            theme:
              - 'themes/**'
              - '!themes/rrroca/static/js/**'
              - 'hugo.toml'
              - 'static/css/**'
            js:
              - 'themes/rrroca/static/js/**'
            site:
              - 'content/**'
              - 'static/**'
              - 'themes/**'
              - 'hugo.toml'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'staticwebapp.config.json'
              - 'jest.config.js'

      - name: Docs-only shortcut
        if: steps.changes.outputs.site == 'false' && github.event_name == 'pull_request'
        run: echo "✅ Docs-only change — skipping build and tests"

      - name: Setup Hugo Extended
        if: steps.changes.outputs.site == 'true' || github.event_name != 'pull_request'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Setup Node.js
        if: steps.changes.outputs.site == 'true' || github.event_name != 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.changes.outputs.site == 'true' || github.event_name != 'pull_request'
        run: npm ci

      - name: Build site
        if: steps.changes.outputs.site == 'true' || github.event_name != 'pull_request'
        run: hugo --gc --minify --buildFuture --baseURL "https://rrroca.github.io/rrroca-site/"

      - name: Run Jest unit tests
        if: steps.changes.outputs.site == 'true' || github.event_name != 'pull_request'
        run: npx jest --verbose --coverage

      - name: Validate HTML (htmltest)
        if: steps.changes.outputs.site == 'true' || github.event_name != 'pull_request'
        run: |
          curl -sSL https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz | tar -xz
          ./htmltest

  # GitHub Pages deployment removed — SWA is the sole deployment target
