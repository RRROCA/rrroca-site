name: Architecture Review Reminder

on:
  pull_request:
    types: [opened]
    branches: [master]
    paths:
      - 'api/**'
      - 'staticwebapp.config.json'
      - 'hugo.toml'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  architecture-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect risk areas
        id: risk
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
            swa_config:
              - 'staticwebapp.config.json'
            site_config:
              - 'hugo.toml'
            workflows:
              - '.github/workflows/**'

      - name: Post architecture checklist
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- architecture-review-checklist -->';

            // Build context-aware checklist based on what changed
            let items = [];

            if ('${{ steps.risk.outputs.api }}' === 'true') {
              items.push('- [ ] **Security**: Auth guards intact, no new secrets in logs, rate limiting preserved');
              items.push('- [ ] **Cost**: Azure OpenAI usage impact assessed (TPM, token volume)');
              items.push('- [ ] **Degradation**: Site loads gracefully if API is unavailable');
            }

            if ('${{ steps.risk.outputs.swa_config }}' === 'true') {
              items.push('- [ ] **CSP/Headers**: No security regressions in Content-Security-Policy or auth config');
              items.push('- [ ] **Routing**: Auth providers and route guards unchanged or intentionally modified');
            }

            if ('${{ steps.risk.outputs.site_config }}' === 'true') {
              items.push('- [ ] **Build**: Hugo config changes tested locally with `hugo --quiet`');
              items.push('- [ ] **Features**: No new external dependencies without graceful fallback');
            }

            if ('${{ steps.risk.outputs.workflows }}' === 'true') {
              items.push('- [ ] **Permissions**: Minimal permissions used (no unnecessary `write` scopes)');
              items.push('- [ ] **Supply chain**: Action versions pinned to SHA or specific version tag');
              items.push('- [ ] **Secrets**: Only necessary secrets referenced');
            }

            // Always include these
            items.push('- [ ] **Docs updated**: `SECURITY.md`, `docs/ALM-ARCHITECTURE.md`, or `docs/CONTINUITY-BINDER.md` if architecture changes');
            items.push('- [ ] **Succession**: A new volunteer could understand this change in 6 months');

            const body = [
              marker,
              '## 🏔️ Architecture Review Checklist',
              '',
              'This PR modifies infrastructure/security files. Please verify before merging:',
              '',
              ...items,
              '',
              '---',
              '*Auto-generated by [architecture-review.yml](.github/workflows/architecture-review.yml). See [architecture principles](docs/architecture-principles.md) for context.*',
            ].join('\n');

            // Check for existing comment to avoid duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
            }
